<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitewise — Sign In</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
</head>
<body>
    <div class="shader-overlay" style="position:fixed;inset:0;height:100vh;opacity:0.15;z-index:0;">
        <canvas id="shaderCanvas" style="width:100%;height:100%;"></canvas>
    </div>

    <!-- Minimal Navbar -->
    <nav class="navbar">
        <a href="index.html" class="navbar-logo">
            <span class="accent-dot"></span>
            Sitewise
        </a>
        <div class="navbar-links">
            <a href="index.html">Home</a>
            <a href="auth.html" class="active">Sign In</a>
        </div>
        <button class="navbar-hamburger" id="hamburgerBtn" aria-label="Menu">&#9776;</button>
    </nav>

    <div class="mobile-drawer glass-card-strong" id="mobileDrawer">
        <button class="close-btn" id="drawerCloseBtn">&times;</button>
        <a href="index.html">Home</a>
        <a href="auth.html" class="active">Sign In</a>
    </div>

    <!-- Auth Page -->
    <div class="auth-page">
        <div class="glow-orb glow-orb-md" style="top:50%;left:50%;transform:translate(-50%,-50%);opacity:0.2;"></div>
        <div class="auth-card glass-card-strong" id="authCard">
            <h2 id="authTitle">Welcome back</h2>
            <p class="subtitle" id="authSubtitle">Sign in to your Sitewise account</p>

            <div id="authError" class="auth-error"></div>

            <form id="authForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@company.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password" minlength="6">
                </div>
                <button type="submit" class="btn-primary full" id="authSubmitBtn">Sign In</button>
            </form>

            <div class="auth-switch" id="authSwitch">
                <span id="authSwitchText">Don't have an account?</span>
                <a id="authSwitchLink">Sign Up</a>
            </div>
        </div>
    </div>

    <script src="shader.js"></script>
    <script>
        // ─── Toggle between Sign In / Sign Up ──────────────
        const params = new URLSearchParams(window.location.search);
        let mode = params.get('mode') || 'signin';

        const title = document.getElementById('authTitle');
        const subtitle = document.getElementById('authSubtitle');
        const submitBtn = document.getElementById('authSubmitBtn');
        const switchText = document.getElementById('authSwitchText');
        const switchLink = document.getElementById('authSwitchLink');
        const authForm = document.getElementById('authForm');
        const authCard = document.getElementById('authCard');
        const authError = document.getElementById('authError');

        function setMode(newMode) {
            authCard.style.opacity = '0';
            authCard.style.transform = 'scale(0.97)';
            setTimeout(() => {
                mode = newMode;
                if (mode === 'signup') {
                    title.textContent = 'Create your account';
                    subtitle.textContent = 'Run your first risk assessment in under 60 seconds';
                    submitBtn.textContent = 'Create Account';
                    switchText.textContent = 'Already have an account?';
                    switchLink.textContent = 'Sign In';
                } else {
                    title.textContent = 'Welcome back';
                    subtitle.textContent = 'Access your risk assessments and project data';
                    submitBtn.textContent = 'Sign In';
                    switchText.textContent = "Don't have an account?";
                    switchLink.textContent = 'Sign Up';
                }
                authError.classList.remove('visible');
                authCard.style.opacity = '1';
                authCard.style.transform = 'scale(1)';
            }, 150);
        }

        authCard.style.transition = 'opacity 0.2s var(--transition-smooth), transform 0.2s var(--transition-smooth)';

        setMode(mode);

        switchLink.addEventListener('click', (e) => {
            e.preventDefault();
            const newMode = mode === 'signin' ? 'signup' : 'signin';
            setMode(newMode);
            window.history.replaceState(null, '', '?mode=' + newMode);
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                authError.textContent = 'Please enter your email and password.';
                authError.classList.add('visible');
                return;
            }

            authError.classList.remove('visible');
            authError.textContent = '';
            authError.style.color = '';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Loading...';

            try {
                if (mode === 'signup') {
                    const result = await signUp(email, password);

                    if (result.error) {
                        authError.textContent = friendlyError(result.error.message);
                        authError.classList.add('visible');
                        return;
                    }

                    // No session means email confirmation is required
                    if (!result.data?.session) {
                        authError.style.color = '#6FA37D';
                        authError.textContent = 'Account created! Check your email for a confirmation link, then sign in.';
                        authError.classList.add('visible');
                        // Switch to sign-in mode so they can log in after confirming
                        setMode('signin');
                        window.history.replaceState(null, '', '?mode=signin');
                        return;
                    }

                    // Session exists (email confirmation disabled in Supabase) — redirect
                    window.location.href = 'app.html';

                } else {
                    const result = await signIn(email, password);

                    if (result.error) {
                        authError.textContent = friendlyError(result.error.message);
                        authError.classList.add('visible');
                        return;
                    }

                    window.location.href = 'app.html';
                }
            } catch (err) {
                authError.textContent = friendlyError(err.message || 'Something went wrong. Please try again.');
                authError.classList.add('visible');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = mode === 'signup' ? 'Create Account' : 'Sign In';
            }
        });

        function friendlyError(msg) {
            if (!msg) return 'Something went wrong. Please try again.';
            if (msg.includes('Invalid login credentials')) return 'No account found with that email and password. Please check your details or sign up.';
            if (msg.includes('Email not confirmed')) return 'Please confirm your email first. Check your inbox for the confirmation link.';
            if (msg.includes('User already registered')) return 'An account with this email already exists. Try signing in instead.';
            if (msg.includes('Password should be at least')) return 'Password must be at least 6 characters.';
            return msg;
        }

        // If already logged in, redirect to app
        getCurrentUser().then(user => {
            if (user) {
                window.location.href = 'app.html';
            }
        });
    </script>
</body>
</html>
